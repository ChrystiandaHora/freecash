# Configuração do nginx que serve o SPA do FreeCash em produção. Duas
# responsabilidades:
#
# 1. Fallback de rotas do SPA. As rotas são resolvidas no cliente, então um acesso
#    direto a /dashboard ou a um link de e-mail chega como caminho que não existe em
#    disco — sem o try_files, todo link de e-mail devolveria 404.
#
# 2. Proxy de /api/. Mesma origem elimina o CORS e mantém o cookie do refresh
#    same-site; em origens distintas ele exigiria SameSite=None, que amplia a
#    superfície de CSRF.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx nas respostas e nas páginas de erro.
    server_tokens off;

    # O upload de extratos e faturas em PDF passa por aqui.
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER lê este cabeçalho para reconhecer HTTPS. Sem ele,
        # SECURE_SSL_REDIRECT entra em laço de redirecionamento.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Artefatos do Vite têm hash no nome: versão nova, nome novo. Cache longo é seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html sem cache, senão o navegador segue pedindo os artefatos antigos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
