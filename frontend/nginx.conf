# Configuração do nginx que serve o SPA do FreeCash em produção.
#
# Duas responsabilidades, ambas necessárias:
#
# 1. Fallback de rotas do SPA. O React Router resolve as rotas no cliente, então um
#    acesso direto a /dashboard ou /verificar-email/<uid>/<token> chega ao nginx como
#    um caminho que não existe em disco. Sem o try_files abaixo, todo link de e-mail
#    e todo recarregamento de página interna retornaria 404.
#
# 2. Proxy de /api/ para o backend. Servir API e SPA na mesma origem elimina o CORS
#    e permite que o cookie do refresh token seja same-site — com o backend em outra
#    origem, o cookie exigiria SameSite=None, que só funciona com Secure e amplia a
#    superfície de CSRF.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx nas respostas e nas páginas de erro.
    server_tokens off;

    # O upload de extratos e faturas em PDF passa por aqui.
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER em settings.py depende deste cabeçalho para
        # reconhecer a requisição como HTTPS. Sem ele, SECURE_SSL_REDIRECT entra em
        # laço infinito de redirecionamento.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Os artefatos do Vite carregam hash no nome, então podem ser cacheados por muito
    # tempo com segurança: uma versão nova gera um nome novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca pode ser cacheado, senão o navegador continua pedindo os
    # artefatos da versão anterior depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
