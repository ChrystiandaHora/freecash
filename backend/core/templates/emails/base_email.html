{% comment %}
Esqueleto dos e-mails transacionais do FreeCash.

Restrições que ditam este HTML, e que não são preciosismo:
- CSS embutido em atributo `style`, porque a maioria dos clientes de e-mail
  descarta `<style>` no cabeçalho e o Gmail remove seletores de classe.
- Layout em `<table>`, porque flexbox e grid não têm suporte confiável em Outlook.
- Nenhuma imagem remota: a maioria dos clientes bloqueia imagens por padrão, e um
  layout que dependa delas chega quebrado.
- Cores com contraste suficiente sobre fundo claro; o e-mail não tem tema escuro
  garantido, então o texto não pode depender de cor para ser legível.
{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:8px;padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1f2933;">
        <tr>
          <td>
            <p style="margin:0 0 24px;font-size:18px;font-weight:600;color:#0f172a;">FreeCash</p>
            {% block conteudo %}{% endblock %}
            <hr style="border:none;border-top:1px solid #e4e7eb;margin:32px 0 16px;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#616e7c;">
              Você recebeu esta mensagem porque este endereço está associado a uma conta no FreeCash.
              Se não foi você que solicitou, pode ignorar este e-mail com segurança.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
