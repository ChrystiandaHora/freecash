# Integração contínua do FreeCash.
#
# Custo: este repositório é público, então os runners padrão do GitHub Actions são
# gratuitos e sem limite de minutos. Se ele virar privado, o plano Free concede
# 2.000 minutos/mês — a execução completa gasta cerca de 3 minutos.
#
# O workflow apenas reporta. Para que uma falha impeça o merge, é preciso habilitar
# a proteção de branch no site do GitHub; o passo a passo está em docs/testes.md.
name: CI

on:
  # Sem `push`: o mesmo commit seria testado duas vezes no fluxo de pull request,
  # gastando o dobro de tempo para produzir o mesmo resultado.
  pull_request:
    branches: [main]
  # Permite rodar sob demanda pela aba Actions, sem abrir pull request.
  workflow_dispatch:

# Um push novo no mesmo pull request cancela a execução anterior: só o último
# commit interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Os testes exigem PostgreSQL: a migration 0002 cria um índice único parcial
    # sobre LOWER(email), que é sintaxe específica do Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freecash_ci
          POSTGRES_USER: freecash_ci
          POSTGRES_PASSWORD: freecash_ci
        ports:
          - 5432:5432
        # Sem este healthcheck, o job começa antes de o banco aceitar conexões e
        # falha de forma intermitente.
        options: >-
          --health-cmd "pg_isready -U freecash_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Configuração de teste, não de produção: a chave é descartável de propósito
      # e DEBUG=True evita que validar_config_producao() exija segredos reais.
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: chave-de-teste-sem-valor-em-producao
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: freecash_ci
      DB_USER: freecash_ci
      DB_PASS: freecash_ci
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma versão da imagem de produção (backend/Dockerfile.backend).
          # Testar numa versão diferente da que atende tráfego deixaria passar
          # justamente as quebras específicas de versão.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar se há migration não commitada
        working-directory: backend
        # Falha se algum modelo foi alterado sem gerar migration. Esse é o erro que
        # só aparece no deploy, quando o servidor aplica um esquema desatualizado.
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes
        working-directory: backend
        run: |
          coverage erase
          coverage run manage.py test --parallel
          coverage combine
          coverage report -m

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        # `npm ci` em vez de `npm install`: instala exatamente o que está no
        # package-lock.json, sem resolver versões de novo.
        run: npm ci

      - name: Lint
        working-directory: frontend
        # Não bloqueia o merge por enquanto. O ESLint acusa 24 erros que já
        # existiam antes desta configuração (na maioria `react-hooks/set-state-in-
        # effect` e `react-refresh/only-export-components`, em telas de
        # investimento). Deixar bloqueante hoje reprovaria todo pull request desde
        # o primeiro, e o efeito prático seria aprender a ignorar o CI.
        #
        # O relatório continua visível no log do job. Quando a contagem chegar a
        # zero, remova esta linha para que uma regressão volte a reprovar.
        continue-on-error: true
        run: npm run lint

      - name: Rodar os testes
        working-directory: frontend
        run: npm run test
