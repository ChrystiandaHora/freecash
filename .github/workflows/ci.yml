# Integração contínua do FreeCash.
#
# Repositório público: os runners padrão são gratuitos e sem limite de minutos. Se
# virar privado, o plano Free dá 2.000 min/mês e a execução gasta ~3 minutos.
#
# O workflow só reporta. Para uma falha impedir o merge é preciso habilitar a
# proteção de branch — passo a passo em docs/testes.md.
name: CI

on:
  # Sem `push`: no fluxo de pull request o mesmo commit rodaria duas vezes.
  pull_request:
    branches: [main]
  # Permite rodar sob demanda pela aba Actions, sem abrir pull request.
  workflow_dispatch:

# Push novo no mesmo pull request cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Os testes exigem PostgreSQL: a migration 0002 usa índice único parcial.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freecash_ci
          POSTGRES_USER: freecash_ci
          POSTGRES_PASSWORD: freecash_ci
        ports:
          - 5432:5432
        # Sem healthcheck, o job começa antes do banco aceitar conexão.
        options: >-
          --health-cmd "pg_isready -U freecash_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Configuração de teste: chave descartável, e DEBUG=True evita que
      # validar_config_producao() exija segredos reais.
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: chave-de-teste-sem-valor-em-producao
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: freecash_ci
      DB_USER: freecash_ci
      DB_PASS: freecash_ci
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma versão da imagem de produção (backend/Dockerfile.backend).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar se há migration não commitada
        working-directory: backend
        # Falha se um modelo mudou sem gerar migration — erro que, sem isso, só
        # aparece no deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes
        working-directory: backend
        run: |
          coverage erase
          coverage run manage.py test --parallel
          coverage combine
          coverage report -m

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        # `npm ci` instala exatamente o package-lock.json, sem re-resolver versões.
        run: npm ci

      - name: Lint
        working-directory: frontend
        # Não bloqueia: são 24 erros anteriores a esta configuração, quase todos nas
        # telas de investimento. Um CI vermelho desde o primeiro PR ensina a ignorá-lo.
        # Zerada a contagem, remova esta linha para uma regressão voltar a reprovar.
        continue-on-error: true
        run: npm run lint

      - name: Rodar os testes
        working-directory: frontend
        run: npm run test
