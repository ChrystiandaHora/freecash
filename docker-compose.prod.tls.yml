# Sobreposição opcional: HTTPS com certificado automático.
#
# Uso, sempre junto com o compose de produção:
#
#   DOMAIN=freecash.exemplo.com \
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.tls.yml up -d --build
#
# Antes de subir, no .env:
#
#   HTTP_PORT=127.0.0.1:8080     # tira o frontend da porta 80 pública; ele passa a
#                                # escutar só em loopback, alcançável pelo Caddy
#   DOMAIN=freecash.exemplo.com
#   VITE_API_URL=https://freecash.exemplo.com
#   DJANGO_ALLOWED_HOSTS=freecash.exemplo.com
#   DJANGO_CSRF_TRUSTED_ORIGINS=https://freecash.exemplo.com
#   DJANGO_SECURE_SSL_REDIRECT=True
#
# Este arquivo não é necessário nos outros dois cenários descritos em DEPLOY.md
# (acesso por IP em HTTP, ou domínio atrás do Cloudflare).

services:
  caddy:
    image: caddy:2-alpine
    container_name: freecash_caddy
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}

    ports:
      - "80:80"
      - "443:443"
      # QUIC/HTTP3. Opcional; remova se o provedor cobrar por regra de firewall.
      - "443:443/udp"

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados vivem aqui. Sem este volume, cada `up` pede um certificado
      # novo e o Let's Encrypt aplica limite de emissões por semana.
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
